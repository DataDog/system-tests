include:
  - remote: https://gitlab-templates.ddbuild.io/libdatadog/include/versions/1.11.1/single-step-instrumentation-tests.yml

stages:
  - SSI_TESTS
  - DOCKER_SSI
  - K8S_LIB_INJECTION

variables:
  FF_GITRETRIEVER_GITHUB_INSTEADOF: "true"
  PRIVATE_DOCKER_REGISTRY: 235494822917.dkr.ecr.us-east-1.amazonaws.com
  PRIVATE_DOCKER_REGISTRY_USER: AWS

ssi_tests:
  image: registry.ddbuild.io/ci/libdatadog-build/ci_docker_base:100425777
  tags: ["arch:amd64"]
  stage: SSI_TESTS
  script:
    - echo "NO AWS TESTS TO RUN"

.base_docker_ssi_job:
    extends: .base_job_k8s_docker_ssi
    needs: []
    allow_failure: false
    timeout: 30 minutes
    variables:
      # Force gitlab to keep the exit code as 3 if the job fails with exit code 3
      FF_USE_NEW_BASH_EVAL_STRATEGY: true
      # gitlab_exporter.py points it to the system-tests checkout when another repository runs the job.
      SYSTEM_TESTS_DIR: $CI_PROJECT_DIR
    after_script:
      - bash "${SYSTEM_TESTS_DIR}/utils/scripts/gitlab_finalize_job.sh" --profile docker
    retry:
      max: 2
      when:
        - job_execution_timeout
        - unknown_failure
        - data_integrity_failure
        - runner_system_failure
        - scheduler_failure
        - api_failure
      #System-tests exit code 1 if there are tests failures
      #System-tests exit code 3 if there is a issue starting the scenario
      #Timeout 124
      exit_codes:
        - 3
        - 124
    artifacts:
      when: always
      paths:
        - reports/

.base_job_onboarding_system_tests:
    extends: .base_job_onboarding
    needs: []
    allow_failure: false
    variables:
      # Force gitlab to keep the exit code as 3 if the job fails with exit code 3
      FF_USE_NEW_BASH_EVAL_STRATEGY: true
      # gitlab_exporter.py points it to the system-tests checkout when another repository runs the job.
      SYSTEM_TESTS_DIR: $CI_PROJECT_DIR
    script:
        - |
            if [[ -n "${DD_INSTALL_SCRIPT_VERSION}" ]]; then
              echo "Downloading the installer script from S3: system-tests-aws-agent-linux-install-script/${DD_INSTALL_SCRIPT_VERSION}"
              aws s3 cp s3://system-tests-aws-agent-linux-install-script/${DD_INSTALL_SCRIPT_VERSION}/install_script_agent7.sh binaries/
              chmod +x binaries/install_script_agent7.sh
            fi
        - |
            BUILD_SECTION_TS=$(date +%s)
            printf '\e[0Ksection_start:%s:build_runner[collapsed=true]\r\e[0KBuild runner image (./build.sh -i runner)\n' "${BUILD_SECTION_TS}"
            SYSTEM_TEST_BUILD_ATTEMPTS=3 SYSTEM_TEST_BUILD_TIMEOUT=240 ./build.sh -i runner
            printf '\e[0Ksection_end:%s:build_runner\r\e[0K\n' "${BUILD_SECTION_TS}"
        - |
            # Run the tests and capture stdout+stderr to a file
            set -o pipefail
            timeout 3000 ./run.sh "$SCENARIO" --vm-weblog "${WEBLOG}" --vm-env "${ONBOARDING_FILTER_ENV}" --vm-library "${TEST_LIBRARY}" --vm-provider aws --vm-default-vms All --vm-only "${VM}" --report-run-url "${CI_JOB_URL}" --report-environment "${ONBOARDING_FILTER_ENV}" 2>&1 | tee "${CI_PROJECT_DIR}/run_output.log"
    after_script:
      - bash "${SYSTEM_TESTS_DIR}/utils/scripts/gitlab_finalize_job.sh" --profile aws
    retry:
      max: 2
      when:
        - job_execution_timeout
        - unknown_failure
        - data_integrity_failure
        - runner_system_failure
        - scheduler_failure
        - api_failure
      #System-tests exit code 1 if there are tests failures
      #System-tests exit code 3 if there is a issue starting the scenario
      #Timeout 124 (run.sh is wrapped in `timeout 3000`)
      exit_codes:
        - 3
        - 124
    artifacts:
        when: always
        paths:
            - reports/

.k8s_lib_injection_base:
  extends: .base_job_k8s_docker_ssi
  needs: []
  stage: K8S_LIB_INJECTION
  allow_failure: false
  timeout: 35 minutes
  variables:
    # Force gitlab to keep the exit code as 3 if the job fails with exit code 3
    FF_USE_NEW_BASH_EVAL_STRATEGY: true
    # gitlab_exporter.py points it to the system-tests checkout when another repository runs the job.
    SYSTEM_TESTS_DIR: $CI_PROJECT_DIR
  script:
    - |
      # Wrap the build steps (runner image, venv, ECR login, weblog image) in a
      # collapsible GitLab section to keep the job log tidy.
      BUILD_SECTION_TS=$(date +%s)
      printf '\e[0Ksection_start:%s:build_k8s[collapsed=true]\r\e[0KBuild runner image and weblog image\n' "${BUILD_SECTION_TS}"
      SYSTEM_TEST_BUILD_ATTEMPTS=3 SYSTEM_TEST_BUILD_TIMEOUT=240 ./build.sh -i runner # rebuild runner in case there were changes
      source venv/bin/activate
      python --version
      pip freeze
      aws ecr get-login-password | docker login --username ${PRIVATE_DOCKER_REGISTRY_USER} --password-stdin ${PRIVATE_DOCKER_REGISTRY}
      export PRIVATE_DOCKER_REGISTRY_TOKEN=$(aws ecr get-login-password --region us-east-1)
      if [ "$CI_PROJECT_NAME" = "system-tests" ] && [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        TAG_NAME=$([ "$CI_COMMIT_BRANCH" = "main" ] && echo "latest" || echo "$CI_COMMIT_BRANCH" | tr '/' '-')
        ./lib-injection/build/build_lib_injection_weblog.sh -w ${K8S_WEBLOG} -l ${TEST_LIBRARY} \
          --push-tag ${PRIVATE_DOCKER_REGISTRY}/system-tests/${K8S_WEBLOG}:${TAG_NAME} \
          --docker-platform linux/amd64
      else
        TAG_NAME="latest"
      fi
      printf '\e[0Ksection_end:%s:build_k8s\r\e[0K\n' "${BUILD_SECTION_TS}"
    - |
      # Run the tests and capture stdout+stderr so the after_script can
      # re-print the run summary (pipefail keeps run.sh's real exit code).
      set -o pipefail
      # Catalog entries are stored as ssi/... or ssi-dev/.... Put the registry back.
      # Any other value is a custom image reference and must be used as given.
      expand_k8s_ref() {
        case "$1" in
          ssi/*|ssi-dev/*) printf '%s/%s' "${PRIVATE_DOCKER_REGISTRY}" "$1" ;;
          *) printf '%s' "$1" ;;
        esac
      }
      if [ -z "${K8S_WEBLOG_IMG:-}" ]; then
        K8S_WEBLOG_IMG="${PRIVATE_DOCKER_REGISTRY}/system-tests/${K8S_WEBLOG}"
      fi
      K8S_LIB_INIT_IMG=$(expand_k8s_ref "${K8S_LIB_INIT_IMG}")
      K8S_INJECTOR_IMG=$(expand_k8s_ref "${K8S_INJECTOR_IMG:-}")
      K8S_CLUSTER_IMG=$(expand_k8s_ref "${K8S_CLUSTER_IMG:-}")
      ./run.sh ${K8S_SCENARIO} --k8s-library ${TEST_LIBRARY} --k8s-weblog ${K8S_WEBLOG} --k8s-weblog-img ${K8S_WEBLOG_IMG}:${TAG_NAME} --k8s-lib-init-img ${K8S_LIB_INIT_IMG} --k8s-injector-img ${K8S_INJECTOR_IMG:-None} --k8s-cluster-img ${K8S_CLUSTER_IMG:-None} --report-run-url $CI_JOB_URL --report-environment ${REPORT_ENVIRONMENT} 2>&1 | tee "${CI_PROJECT_DIR}/run_output.log"

  after_script:
    - bash "${SYSTEM_TESTS_DIR}/utils/scripts/gitlab_finalize_job.sh" --profile k8s
  retry:
    max: 2
    when:
      - job_execution_timeout
      - unknown_failure
      - data_integrity_failure
      - runner_system_failure
      - scheduler_failure
      - api_failure
    #System-tests exit code 1 if there are tests failures
    #System-tests exit code 3 if there is a issue starting the scenario
    exit_codes:
      - 3
  artifacts:
    when: always
    paths:
      - reports/
