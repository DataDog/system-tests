---
# Proposals that a reviewer rejected in an earlier review-learning pull request.
# decide.py skips a proposal with the same action and target, unless it brings evidence from
# a pull request that is not in prs. The target is rule_id for an edit, and lens for a new rule,
# because a new rule gets a new ID in each run.
#
# Examples:
# - rule_id: LIFE-002
#   action: add_not_when
#   prs: [8123, 8150]
#   reason: The delay is part of the behavior under test only in the profiling scenario.
# - lens: test-effectiveness
#   action: new_rule
#   prs: [8201]
#   reason: TEST-002 already covers this case.
[]
