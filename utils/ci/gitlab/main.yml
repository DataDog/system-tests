---
spec:
  inputs:
    stage:
      description: "CI stage for all jobs in this component and the generated child pipeline"
    libraries:
      default: ""
    scenarios:
      description: "Comma-separated list of scenarios to run"
      default: ""
    scenarios_groups:
      description: "Comma-separated list of scenario groups to run"
      default: ""
    excluded_scenarios:
      description: "Comma-separated list of scenarios not to run"
      default: "OTEL_TRACING_E2E,OTEL_METRIC_E2E,OTEL_LOG_E2E,INTEGRATION_FRAMEWORKS"
    weblogs:
      description: "Comma-separated list of weblogs to run (all weblogs if empty)"
      default: ""
    binaries_artifacts:
      description: "Semicolon-separated list of upstream jobs whose artifacts contain the pre-built binaries (downloaded by the generated build/run jobs via cross-pipeline needs). Use ';' not ',' because job names may contain commas (e.g. parallel matrix names)."
      default: ""
    binaries_artifact_path:
      description: "Path (relative to CI_PROJECT_DIR) of the binaries_artifact contents, copied into binaries/ before building/running"
      default: ""
    force_execute:
      description: "Comma-separated test node IDs to force-execute"
      default: ""
    skip_empty_scenarios:
      description: "Skip scenarios that contain only xfail or irrelevant tests"
      type: boolean
      default: false
    parametric_job_count:
      description: "Number of parallel jobs for the PARAMETRIC scenario"
      type: number
      default: 6
    parametric_workers:
      description: "Maximum number of pytest-xdist workers per PARAMETRIC job"
      type: number
      default: 4
    push_to_test_optimization:
      description: "Push test results to Datadog Test Optimization"
      type: boolean
      default: false
    allow_failure:
      description: "Allow system-tests e2e jobs to fail without failing the parent pipeline"
      type: boolean
      default: false
    auto_cancel_on_new_commit:
      description: "Auto-cancel strategy when a new commit is pushed (interruptible, conservative, disabled)"
      default: "interruptible"
    ref:
      description: "system-tests ref to use when called from another repository (branch, tag or SHA)"
      default: "main"
    condition:
      description: "GitLab CI rule expression controlling whether system-tests jobs run (e.g. '$NIGHTLY_BUILD == \"true\"'). Defaults to always-run."
      default: "null == null"
    split_pipeline:
      description: "Split jobs across multiple child pipelines"
      type: boolean
      default: false

---

include:
  - project: 'DataDog/system-tests'
    ref: $[[ inputs.ref ]]
    file: 'utils/ci/gitlab/templates.yml'
    inputs:
      stage: $[[ inputs.stage ]]
      ref: $[[ inputs.ref ]]

workflow:
  rules:
    - when: always
      auto_cancel:
        on_new_commit: $[[ inputs.auto_cancel_on_new_commit ]]

variables:
  # Tag = first 12 chars of sha256(utils/ci/gitlab/docker/system-tests.Dockerfile + requirements.txt)
  # Update this when either file changes:
  #   cat utils/ci/gitlab/docker/system-tests.Dockerfile requirements.txt | sha256sum | cut -c1-12
  CI_IMAGE: "registry.ddbuild.io/system-tests/ci-runner:970b845364b9"
  SYSTEM_TESTS_SPLIT_PIPELINE: "$[[ inputs.split_pipeline ]]"

.system_tests_param_base:
  image: $CI_IMAGE
  allow_failure: $[[ inputs.allow_failure ]]
  tags:
    - arch:amd64
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  script:
    - dd-sts exchange --policy system-tests-gitlab -- datadog-ci tag --level job --tags "system-tests.job_type:setup" --tags "ci.framework.name:system-tests"
    - python3 /system-tests/utils/ci/gitlab/validate_param_env.py
    - echo "SYSTEM_TESTS_PIPELINE_START_TIME=$(date +%s)" >> param.env
  artifacts:
    reports:
      dotenv: param.env

system_tests_build_pipeline:
  extends: .system_tests_base
  allow_failure: $[[ inputs.allow_failure ]]
  tags:
    - arch:amd64
  rules:
    - if: $[[ inputs.condition ]]
    - when: never
  needs:
    - job: build_ci_image
      optional: true
      artifacts: false
    - job: system_tests_param
      optional: true
      artifacts: true
  script:
    - dd-sts exchange --policy system-tests-gitlab -- datadog-ci tag --level job --tags "system-tests.job_type:generate-pipeline"
    # pipeline variables set by the caller (LIBRARIES, SCENARIOS, SYSTEM_TESTS_PARAMETRIC_JOB_COUNT, ...) are
    # read from the environment and merged with the inputs by build_pipeline.py
    - >
      python3 utils/ci/gitlab/build_pipeline.py
      --stage "$[[ inputs.stage ]]"
      --ci-image "$CI_IMAGE"
      --ref "$[[ inputs.ref ]]"
      --output-dir .
      --libraries "$[[ inputs.libraries ]]"
      --scenarios "$[[ inputs.scenarios ]]"
      --scenario-groups "$[[ inputs.scenarios_groups ]]"
      --weblogs "$[[ inputs.weblogs ]]"
      --excluded-scenarios "$[[ inputs.excluded_scenarios ]]"
      --force-execute "$[[ inputs.force_execute ]]"
      --parametric-job-count "$[[ inputs.parametric_job_count ]]"
      --parametric-workers "$[[ inputs.parametric_workers ]]"
      --push-to-test-optimization "$[[ inputs.push_to_test_optimization ]]"
      --skip-empty-scenario "$[[ inputs.skip_empty_scenarios ]]"
      --split-pipeline "$[[ inputs.split_pipeline ]]"
      --binaries-artifacts "$[[ inputs.binaries_artifacts ]]"
      --binaries-artifact-path "$[[ inputs.binaries_artifact_path ]]"
  artifacts:
    paths:
      - system-tests/generated-pipeline-chunk-*.yml

.run_test_pipeline_base:
  interruptible: true
  trigger:
    # Don't forward any variable to the child pipelines: top-level variables of the caller would be passed too,
    # and would take precedence over the job variables of the generated jobs (TEST_LIBRARY, ...). The values the
    # child pipelines need (CI_IMAGE, UPSTREAM_PIPELINE_ID, ...) are written in the generated files instead.
    forward:
      yaml_variables: false
  allow_failure: $[[ inputs.allow_failure ]]
  stage: $[[ inputs.stage ]]
  rules:
    - if: $[[ inputs.condition ]]
    - when: never
  needs:
    - job: system_tests_build_pipeline
      optional: true
      artifacts: true
    - job: system_tests_param
      optional: true
      artifacts: true
    - job: mirror_images
      optional: true
      artifacts: false
    - job: build_base_images
      optional: true
      artifacts: false

system_tests_e2e_run_pipeline_0:
  extends: .run_test_pipeline_base
  trigger:
    include:
      - artifact: system-tests/generated-pipeline-chunk-0.yml
        job: system_tests_build_pipeline
    strategy: depend

system_tests_e2e_run_pipeline_1:
  extends: .run_test_pipeline_base
  rules:
    - if: $SYSTEM_TESTS_SPLIT_PIPELINE != "true"
      when: never
    - if: $[[ inputs.condition ]]
    - when: never
  trigger:
    include:
      - artifact: system-tests/generated-pipeline-chunk-1.yml
        job: system_tests_build_pipeline
    strategy: depend

system_tests_e2e_run_pipeline_2:
  extends: .run_test_pipeline_base
  rules:
    - if: $SYSTEM_TESTS_SPLIT_PIPELINE != "true"
      when: never
    - if: $[[ inputs.condition ]]
    - when: never
  trigger:
    include:
      - artifact: system-tests/generated-pipeline-chunk-2.yml
        job: system_tests_build_pipeline
    strategy: depend
