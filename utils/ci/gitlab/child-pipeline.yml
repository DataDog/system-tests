# Static part of the child pipeline(s) generated by build_pipeline.py.
#
# Generated jobs extend the hidden jobs below and only carry what differs from one job to another
# (variables, needs, runner tags). The job logic lives in utils/ci/gitlab/jobs/: scripts read their
# inputs from the job variables, which also reach system-tests commands (build.sh, run.sh) untouched.
#
# Job scripts are started through run_job.py, which imports them without loading the system-tests framework.
#
# Relies on .system_tests_base from templates.yml, included alongside this file.

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - data_integrity_failure
    exit_codes:
      - 255

setup:
  extends: .system_tests_base
  tags: ["arch:amd64"]
  script:
    - datadog-ci tag --level pipeline --tags "system-tests:true"

.push_to_test_optimization:
  after_script:
    # after_script runs in a fresh shell, from $CI_PROJECT_DIR
    - cd system-tests && python3 utils/ci/gitlab/run_job.py push_to_test_optimization

.system_tests_build:
  extends: .system_tests_base
  script:
    - python utils/ci/gitlab/run_job.py build_weblog
  artifacts:
    paths:
      - binaries/

.system_tests_run:
  extends: .system_tests_base
  timeout: 15 minutes
  variables:
    KUBERNETES_CPU_REQUEST: 0.5
    KUBERNETES_MEMORY_REQUEST: 1.3Gi
  script:
    - python utils/ci/gitlab/run_job.py run_scenario
  artifacts:
    when: always
    paths:
      - system-tests/logs*

.system_tests_parametric:
  extends: .system_tests_base
  script:
    - python utils/ci/gitlab/run_job.py run_parametric
  artifacts:
    when: always
    paths:
      - system-tests/logs*
