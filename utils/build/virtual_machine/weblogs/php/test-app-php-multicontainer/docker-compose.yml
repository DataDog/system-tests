---
version: '2'

services:
  reverseproxy:
    image: reverseproxy:latest
    ports:
      - 5985:8080
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.reverseproxy
    depends_on:
      php_7_3:
        condition: service_healthy
      php_7_4:
        condition: service_healthy
      php_8_0:
        condition: service_healthy
      php_8_1:
        condition: service_healthy
      php_8_2:
        condition: service_healthy
      php_8_3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  php_7_3:
    env_file: "scenario_app.env"
    image: system-tests/php_7_3:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.php_7_3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:18080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s

