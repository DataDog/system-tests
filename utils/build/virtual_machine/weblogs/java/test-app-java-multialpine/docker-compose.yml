---
version: '3'
services:
  reverseproxy:
    image: reverseproxy:latest
    ports:
      - 5985:8080
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.reverseproxy
    depends_on:
      java_8_alpine:
        condition: service_healthy
      java_11_alpine:
        condition: service_healthy
      java_15_alpine:
        condition: service_healthy
      java_17_alpine:
        condition: service_healthy
      java_21_alpine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  java_8_alpine:
    env_file: "scenario_app.env"
    image: system-tests/java_8_alpine:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.jdk8-alpine
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:18080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  java_11_alpine:
