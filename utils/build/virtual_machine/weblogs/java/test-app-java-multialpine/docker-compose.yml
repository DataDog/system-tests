      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:18080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  java_17_alpine:
    env_file: "scenario_app.env"
    image: system-tests/java_17_alpine:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.jdk17-alpine
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:18080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  java_21_alpine:
