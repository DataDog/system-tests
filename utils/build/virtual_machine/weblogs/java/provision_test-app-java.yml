---
lang_variant:
  name: OpenJDK11
  version: "11"
  cache: true
  install:
    - os_type: linux
      os_distro: deb
      copy_files:
        - name: copy-select-java11
          local_path: utils/build/virtual_machine/weblogs/java/test-app-java/select_java11.sh

        - name: copy-install-corretto11
          local_path: utils/build/virtual_machine/weblogs/java/test-app-java/install_corretto11.sh
      remote-command: |
        # EOL Ubuntu releases (23.04 on arm64) return 404 for openjdk-11 packages: fall back to the Corretto tarball
        (sudo apt-get -y update && sudo apt-get -y install openjdk-11-jdk) || sh install_corretto11.sh
        sh select_java11.sh

    - os_type: linux
      os_distro: rpm
      os_branch: amazon_linux2
      copy_files:
        - name: copy-select-java11
          local_path: utils/build/virtual_machine/weblogs/java/test-app-java/select_java11.sh
      remote-command: |
        sudo yum install -y tar || true
        sudo yum -y install java-11-amazon-corretto
        sh select_java11.sh

    - os_type: linux
      os_distro: rpm
      copy_files:
        - name: copy-select-java11
          local_path: utils/build/virtual_machine/weblogs/java/test-app-java/select_java11.sh

        - name: copy-install-corretto11
          local_path: utils/build/virtual_machine/weblogs/java/test-app-java/install_corretto11.sh
      remote-command: |
        sudo yum install -y tar || sudo dnf install -y tar || true
        # Fedora mirrors can time out from the test VMs: bound the distro install and fall back to the Corretto tarball
        sudo timeout 180 dnf -y --setopt=timeout=20 --setopt=retries=3 install java-11-openjdk-devel \
          || sudo timeout 180 dnf -y --setopt=timeout=20 --setopt=retries=3 install java-11-amazon-corretto-devel \
          || sudo yum -y install java-11-openjdk-devel \
          || sudo yum -y install java-11-amazon-corretto \
          || sh install_corretto11.sh
        sh select_java11.sh

weblog:
  name: test-app-java
  install:
    - os_type: linux

      copy_files:
        - name: copy-service
          local_path: utils/build/virtual_machine/weblogs/common/test-app.service

        - name: copy-service-run-script
          local_path: utils/build/virtual_machine/weblogs/common/create_and_run_app_service.sh

        - name: copy-compile-weblog-script
          local_path: utils/build/virtual_machine/weblogs/java/test-app-java/compile_app.sh

        - name: copy-run-weblog-script
          local_path: utils/build/virtual_machine/weblogs/java/test-app-java/test-app-java_run.sh

        - name: copy-java-app
          local_path: lib-injection/build/docker/java/jetty-app

      remote-command: sh test-app-java_run.sh
