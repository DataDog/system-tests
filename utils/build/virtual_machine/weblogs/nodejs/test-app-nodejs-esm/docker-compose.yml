---
version: '2'

services:
  reverseproxy:
    image: reverseproxy:latest
    ports:
      - 5985:8080
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.reverseproxy
    depends_on:
      node_22:
        condition: service_healthy
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  node_22:
    env_file: "scenario_app.env"
    image: system-tests/node_22:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.node22
    healthcheck:
      test: "node health"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s

  node:
    env_file: "scenario_app.env"
    image: system-tests/node:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.node
    healthcheck:
      test: "node health"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s
