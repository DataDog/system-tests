---
version: '2'

services:
  reverseproxy:
    image: reverseproxy:latest
    ports:
      - 5985:8080
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.reverseproxy
    depends_on:
      python_3_12:
        condition: service_healthy
      python_3_11:
        condition: service_healthy
      python_3_10:
        condition: service_healthy
      python_3_9:
        condition: service_healthy
      python_3_8:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  python_3_12:
    env_file: "scenario_app.env"
    image: system-tests/python_3_12:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.python_3_12
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:18080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s

