---
version: '2'

services:
  reverseproxy:
    image: reverseproxy:latest
    ports:
      - 5985:8080
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.reverseproxy
    depends_on:
      dotnet_8:
        condition: service_healthy
      dotnet_6:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  dotnet_8:
    env_file: "scenario_app.env"
    image: system-tests/dotnet_8:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.dotnet_8-alpine
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:18080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s

  dotnet_6:
    env_file: "scenario_app.env"
    image: system-tests/dotnet_6:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.dotnet_6-alpine
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://localhost:18080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s
