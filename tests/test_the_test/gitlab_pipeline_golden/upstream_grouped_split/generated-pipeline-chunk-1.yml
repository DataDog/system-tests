workflow:
  name: System-tests end to end

include:
- project: DataDog/system-tests
  ref: abc
  file: utils/ci/gitlab/templates.yml
  inputs:
    stage: e2e
    ref: abc
- project: DataDog/system-tests
  ref: abc
  file: utils/ci/gitlab/child-pipeline.yml

stages:
- e2e

variables:
  CI_IMAGE: img
  UPSTREAM_PIPELINE_ID: '42'
  SYSTEM_TESTS_FORCE_EXECUTE: ''
  SYSTEM_TESTS_SKIP_EMPTY_SCENARIO: 'false'
  SYSTEM_TESTS_GENERATED_PIPELINE_START_TIME: ''

system_tests_run_php_apache-mod-8.0_1:
  extends:
  - .system_tests_run
  variables:
    TEST_LIBRARY: php
    SYSTEM_TESTS_WEBLOG: apache-mod-8.0
    SYSTEM_TESTS_SCENARIOS: DEFAULT,THREAD_CONTEXT_SHARING
    SYSTEM_TESTS_WEBLOG_BUILD_REQUIRED: 'false'
    SYSTEM_TESTS_BINARIES_ARTIFACT_PATH: out/bin
  needs:
  - job: build_a
    artifacts: true
    pipeline: $UPSTREAM_PIPELINE_ID
  - job: build b
    artifacts: true
    pipeline: $UPSTREAM_PIPELINE_ID
  tags:
  - docker-in-docker:amd64-cws
  timeout: 29 minutes
