workflow:
  name: System-tests end to end

include:
- project: DataDog/system-tests
  ref: abc
  file: utils/ci/gitlab/templates.yml
  inputs:
    stage: e2e
    ref: abc
- project: DataDog/system-tests
  ref: abc
  file: utils/ci/gitlab/child-pipeline.yml

stages:
- e2e

variables:
  CI_IMAGE: img
  UPSTREAM_PIPELINE_ID: '42'
  SYSTEM_TESTS_FORCE_EXECUTE: tests/a.py::Test_A
  SYSTEM_TESTS_SKIP_EMPTY_SCENARIO: 'false'
  SYSTEM_TESTS_GENERATED_PIPELINE_START_TIME: '1000'

system_tests_build_python_flask-poc:
  extends: .system_tests_build
  variables:
    TEST_LIBRARY: python
    SYSTEM_TESTS_WEBLOG: flask-poc

system_tests_run_python_APPSEC_BLOCKING_flask-poc:
  extends:
  - .system_tests_run
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: python
    SYSTEM_TESTS_WEBLOG: flask-poc
    SYSTEM_TESTS_SCENARIOS: APPSEC_BLOCKING
    SYSTEM_TESTS_WEBLOG_BUILD_REQUIRED: 'true'
  needs:
  - job: system_tests_build_python_flask-poc
    artifacts: true

system_tests_run_python_DEFAULT_flask-poc:
  extends:
  - .system_tests_run
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: python
    SYSTEM_TESTS_WEBLOG: flask-poc
    SYSTEM_TESTS_SCENARIOS: DEFAULT
    SYSTEM_TESTS_WEBLOG_BUILD_REQUIRED: 'true'
  needs:
  - job: system_tests_build_python_flask-poc
    artifacts: true

system_tests_run_python_SAMPLING_flask-poc:
  extends:
  - .system_tests_run
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: python
    SYSTEM_TESTS_WEBLOG: flask-poc
    SYSTEM_TESTS_SCENARIOS: SAMPLING
    SYSTEM_TESTS_WEBLOG_BUILD_REQUIRED: 'true'
  needs:
  - job: system_tests_build_python_flask-poc
    artifacts: true

system_tests_run_python_DEFAULT_uwsgi-poc:
  extends:
  - .system_tests_run
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: python
    SYSTEM_TESTS_WEBLOG: uwsgi-poc
    SYSTEM_TESTS_SCENARIOS: DEFAULT
    SYSTEM_TESTS_WEBLOG_BUILD_REQUIRED: 'true'

system_tests_run_python_PARAMETRIC_1:
  extends:
  - .system_tests_parametric
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: python
    SYSTEM_TESTS_PARAMETRIC_GROUP: '1'
    SYSTEM_TESTS_PARAMETRIC_JOB_COUNT: '2'
    SYSTEM_TESTS_PARAMETRIC_WORKERS: '4'

system_tests_run_python_PARAMETRIC_2:
  extends:
  - .system_tests_parametric
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: python
    SYSTEM_TESTS_PARAMETRIC_GROUP: '2'
    SYSTEM_TESTS_PARAMETRIC_JOB_COUNT: '2'
    SYSTEM_TESTS_PARAMETRIC_WORKERS: '4'

system_tests_run_php_DEFAULT_apache-mod-8.0:
  extends:
  - .system_tests_run
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: php
    SYSTEM_TESTS_WEBLOG: apache-mod-8.0
    SYSTEM_TESTS_SCENARIOS: DEFAULT
    SYSTEM_TESTS_WEBLOG_BUILD_REQUIRED: 'false'

system_tests_run_php_THREAD_CONTEXT_SHARING_apache-mod-8.0:
  extends:
  - .system_tests_run
  - .push_to_test_optimization
  variables:
    TEST_LIBRARY: php
    SYSTEM_TESTS_WEBLOG: apache-mod-8.0
    SYSTEM_TESTS_SCENARIOS: THREAD_CONTEXT_SHARING
    SYSTEM_TESTS_WEBLOG_BUILD_REQUIRED: 'false'
  tags:
  - docker-in-docker:amd64-cws
