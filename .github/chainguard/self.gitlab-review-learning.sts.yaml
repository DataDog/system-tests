---
# Policy for: review_learning in DataDog/system-tests/.gitlab-ci.yml
# Read only: the job reads merged pull requests and review threads, and never writes to GitHub.
# "web" allows a manual run of the schedule from the GitLab UI.
issuer: https://gitlab.ddbuild.io

subject_pattern: "project_path:DataDog/system-tests:ref_type:branch:ref:main"

claim_pattern:
  project_path: "DataDog/system-tests"
  ref: "main"
  ref_type: "branch"
  ref_path: "refs/heads/main"
  ref_protected: "true"
  pipeline_source: "(schedule|web)"
  ci_config_ref_uri: "gitlab\\.ddbuild\\.io/DataDog/system-tests//\\.gitlab-ci\\.yml@refs/heads/main"

permissions:
  contents: read
  pull_requests: read
