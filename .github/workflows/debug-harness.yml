name: Run multiple times a scenario to trigger a flake

on:
  workflow_dispatch:
    inputs:
      library:
        description: Which library
        default: php
        type: string
      weblog:
        description: Which weblog (ignored for PARAMETRIC)
        default: apache-mod-8.1
        type: string
      agent_image:
        description: Which agent image? (Use datadog/agent-dev:master-py3 for latest dev)
        default: datadog/agent:latest
        type: string
      scenario:
        description: Which scenario
        default: DEBUGGER_EXPRESSION_LANGUAGE
        type: string
      run_args:
        description: Extra space-separated arguments passed to pytest, no quoting (e.g. a test nodeid, or -k filter)
        default: ""
        type: string
      job_count:
        description: How many jobs
        default: "10"
        type: string
      dev_or_prod:
        description: Run scenario against last release (prod) or last commit on main (dev)?
        default: "prod"
        type: string
      library_target_branch:
        description: Specify an arbitrary branch of the lib (if set, dev_or_prod is ignored)
        default: ""
        type: string

env:
  LIBRARY:                ${{ (github.event_name == 'workflow_dispatch' && inputs.library)               || 'php' }}
  WEBLOG:                 ${{ (github.event_name == 'workflow_dispatch' && inputs.weblog)                || 'apache-mod-8.1' }}
  SCENARIO:               ${{ (github.event_name == 'workflow_dispatch' && inputs.scenario)              || 'DEBUGGER_EXPRESSION_LANGUAGE' }}
  JOB_COUNT:              ${{ (github.event_name == 'workflow_dispatch' && inputs.job_count)             || '10' }}
  AGENT_IMAGE:            ${{ (github.event_name == 'workflow_dispatch' && inputs.agent_image)           || 'datadog/agent:latest' }}
  DEV_OR_PROD:            ${{ (github.event_name == 'workflow_dispatch' && inputs.dev_or_prod)           || 'prod' }}
  LIBRARY_TARGET_BRANCH:  ${{ (github.event_name == 'workflow_dispatch' && inputs.library_target_branch) || '' }}
  RUN_ARGS:               ${{ (github.event_name == 'workflow_dispatch' && inputs.run_args)              || '' }}

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make.outputs.array }}
    steps:
      - id: make
        run: |
          seq -s, 1 ${{ env.JOB_COUNT }} | awk '{print "[\"" $0 "\"]"}' | sed 's/,/","/g' > arr.json
          echo "array=$(cat arr.json)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Export github token to a file
        run: echo "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/github_token.txt"
      - name: Select agent image
        run: echo ${{ env.AGENT_IMAGE }} > binaries/agent-image
      - name: Get dev artifact
        if: env.DEV_OR_PROD == 'dev'
        run: ./utils/scripts/load-binary.sh ${{ env.LIBRARY }}
      - name: Build weblog
        id: build
        if: env.SCENARIO != 'PARAMETRIC'
        run: SYSTEM_TEST_BUILD_ATTEMPTS=3 ./build.sh ${{ env.LIBRARY }} -i weblog -w ${{ env.WEBLOG }} -s --github-token-file "$RUNNER_TEMP/github_token.txt"
      - name: Remove secrets
        if: always()
        run: |
          TOKEN_FILE="$RUNNER_TEMP/github_token.txt"
          if [ -f "$TOKEN_FILE" ]; then
            echo "Removing token file at $TOKEN_FILE"
            rm -f "$TOKEN_FILE"
          else
            echo "Token file not found — nothing to clean up"
          fi
      - name: Upload artifact
        uses: ./.github/actions/upload_artifact
        with:
          name: weblog
          path: binaries/

  test:
    runs-on: ubuntu-latest
    needs:
      - generate-matrix
      - build
    strategy:
      matrix:
        n: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Install runner
      uses: ./.github/actions/install_runner

    - name: Get binaries artifact
      uses: ./.github/actions/download_artifact
      with:
        name: weblog
        path: binaries/
    - name: Build weblog
      id: build
      if: env.SCENARIO != 'PARAMETRIC'
      run: ./build.sh ${{ env.LIBRARY }} -i weblog -w ${{ env.WEBLOG }}
    - name: Export github token to a file
      id: export_token
      if: env.SCENARIO == 'PARAMETRIC'
      run: echo "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/github_token.txt"

    - name: Run scenario
      run: |
        set -e
        # ++ makes run.sh forward everything after it to pytest, without parsing it as scenarios
        read -ra run_args <<< "$RUN_ARGS"
        if [[ "$SCENARIO" == "PARAMETRIC" ]]; then
          # the parametric image is built by run.sh on the first run, then reused
          echo "Run #1"
          ./run.sh PARAMETRIC -L "$LIBRARY" --github-token-file="$RUNNER_TEMP/github_token.txt" ++ "${run_args[@]}"
          for i in {2..100}
          do
            echo "Run #$i"
            ./run.sh PARAMETRIC -L "$LIBRARY" --skip-parametric-build ++ "${run_args[@]}"
          done
        else
          for i in {1..100}
          do
            echo "Run #$i"
            ./run.sh "$SCENARIO" ++ "${run_args[@]}"
          done
        fi
    - name: Remove secrets
      if: always() && steps.export_token.outcome == 'success'
      run: rm -f "$RUNNER_TEMP/github_token.txt"

    - name: Upload artifact
      if: ${{ !cancelled() && (steps.build.outcome == 'success' || env.SCENARIO == 'PARAMETRIC') }}
      uses: ./.github/actions/upload_artifact
      with:
        name: logs_${{ matrix.n }}
        path: logs_*