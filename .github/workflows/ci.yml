name: OTel app completion validation
on:
  workflow_dispatch:
    inputs:
      libraries:
        description: JSON array of SDKs to validate
        type: string
        default: '["golang", "java", "dotnet", "php", "python", "ruby", "nodejs"]'
permissions:
  contents: read
  id-token: write
jobs:
  parametric:
    name: ${{ matrix.library }} ${{ matrix.version }}
    runs-on:
      group: APM Larger Runners
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJSON(inputs.libraries) }}
        version: [prod, dev]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: ./.github/actions/install_runner
      - name: Load development SDK
        if: matrix.version == 'dev'
        run: ./utils/scripts/load-binary.sh "${{ matrix.library }}"
      - name: Run affected configuration and propagation tests
        shell: bash
        run: |
          printf '%s' "$GITHUB_TOKEN" > "$RUNNER_TEMP/github_token.txt"
          trap 'rm -f "$RUNNER_TEMP/github_token.txt"' EXIT
          ./run.sh PARAMETRIC -L "${{ matrix.library }}" \
            --github-token-file="$RUNNER_TEMP/github_token.txt" \
            tests/parametric/otel_env_vars/test_otel_metric_export_interval.py \
            tests/parametric/otel_env_vars/test_otel_metrics_exporter.py \
            tests/parametric/otel_env_vars/test_otel_log_level.py \
            tests/parametric/otel_env_vars/test_otel_propagators.py \
            tests/parametric/test_parametric_endpoints.py::Test_Parametric_DDTrace_Config
      - name: Preserve test evidence
        if: always()
        uses: ./.github/actions/upload_artifact
        with:
          name: otel-app-completion-${{ matrix.library }}-${{ matrix.version }}
          path: logs_parametric/
          retention-days: 7
