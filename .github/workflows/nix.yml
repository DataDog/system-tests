name: Test Nix

on: # yamllint disable-line rule:truthy
  # On PRs, called by ci.yml when needed (see nix: true in utils/scripts/libraries_and_scenarios_rules.yml):
  # a workflow skipped by a paths filter leaves its required checks pending forever
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: "00 04 * * 0-6"

# Default permissions for all jobs
permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: darwin
            cpu: arm64
            base: macos-15 # always arm64-darwin
          - os: linux
            cpu: x86_64
            base: ubuntu-24.04 # always x86_64-linux-gnu
          - os: linux
            cpu: aarch64
            base: ubuntu-24.04-arm # always aarch64-linux-gnu

    name: Test Nix (${{ matrix.platform.cpu }}-${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.base }}

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        # The test runner fails if it finds a secret in its environment: run steps don't get the OIDC request token
        # (set by id-token: write, only needed by the datadog_ci action, whose steps set their own shell).
        # Same as the default shell (bash -e {0}) otherwise.
        shell: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL bash -e {0}

    env:
      SKIP_SIMPLECOV: 1
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: false
      DD_REMOTE_CONFIGURATION_ENABLED: false

    steps:
      - name: Check CPU arch
        run: |
          test "$(uname -m)" = "${{ matrix.platform.cpu }}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Print python version
        run: |
          nix develop --command which python
          nix develop --command python --version
      - name: Build runner
        run: nix develop --command ./build.sh -i runner
      - name: Test the test
        # no `docker` to actually run tests
        if: ${{ matrix.platform.os != 'darwin' }}
        run: nix develop --command ./run.sh TEST_THE_TEST

  complete:
    name: Nix (complete)
    runs-on: ubuntu-24.04
    needs:
      - test
    steps:
      - run: echo "DONE!"
