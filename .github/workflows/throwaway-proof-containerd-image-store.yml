---
name: "[Throwaway] Proof: first container create with pending writes"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  proof:
    name: ${{ matrix.image_store }} / ${{ matrix.attempt }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image_store:
          - containerd  # the docker default on ubuntu-26.04, before this PR
          - classic  # with this PR
        attempt: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          persist-credentials: false
      - name: Disable the containerd image store
        if: matrix.image_store == 'classic'
        uses: ./.github/actions/disable_containerd_image_store
      - name: Install runner
        uses: ./.github/actions/install_runner
      - name: Build weblog
        run: ./build.sh python -i weblog -w flask-poc
      - name: Pull the images of the scenario
        run: |
          docker pull -q datadog/agent:latest
          docker pull -q datadog/system-tests:proxy-v1
      - name: Leave writes pending on the root filesystem
        run: ./utils/scripts/throwaway_pending_writes.sh start 1500 3M
      - name: Run DEFAULT scenario
        id: run
        continue-on-error: true
        run: |
          # once the proxy is started (or not), drop the pending writes: only its start is measured
          (
            timeout 300 bash -c 'until grep -qE "Healthcheck successful for proxy|Error while starting proxy" logs/tests.log 2>/dev/null; do sleep 0.5; done'
            ./utils/scripts/throwaway_pending_writes.sh stop
          ) > pending-writes-stop.log 2>&1 &
          ./run.sh DEFAULT tests/test_standard_tags.py 2>&1 | tee run.log
      - name: Pending writes after the scenario
        if: ${{ !cancelled() }}
        run: |
          cat pending-writes-stop.log
          grep -E "^(Dirty|Writeback):" /proc/meminfo
      - name: Collect the result
        if: ${{ !cancelled() }}
        run: |
          mkdir -p result
          log=logs/tests.log
          proxy_start=$(grep -m1 "Start container system-tests-proxy$" "$log" | cut -c1-12)
          proxy_end=$(grep -m1 -E "for proxy$|Error while starting proxy" "$log" | cut -c1-12)
          # HH:MM:SS.mmm timestamps, in the same day
          duration=$(awk -v s="$proxy_start" -v e="$proxy_end" 'function secs(t, p) { split(t, p, ":"); return p[1] * 3600 + p[2] * 60 + p[3] }
            BEGIN { if (s == "" || e == "") print "?"; else printf "%.1f", secs(e) - secs(s) }')
          proxy_failed=$(grep -q "Container proxy can't be started" run.log && echo yes || echo no)
          driver=$(docker info --format '{{.Driver}}')
          printf '%s\t%s\t%s\t%s\t%s\n' "${{ matrix.image_store }}" "$driver" "$duration" "$proxy_failed" "${{ steps.run.outcome }}" | tee result/result.tsv
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: proof-${{ matrix.image_store }}-${{ matrix.attempt }}
          path: |
            result/
            run.log
            logs/tests.log

  summary:
    needs: proof
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: proof-*
          path: proof
      - name: Summarize
        run: |
          {
            echo "| image store | storage driver | proxy create+start (s) | Container proxy can't be started | run.sh |"
            echo "|---|---|---|---|---|"
            sort proof/*/result/result.tsv | awk -F'\t' '{ printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5 }'
          } | tee -a "$GITHUB_STEP_SUMMARY"
