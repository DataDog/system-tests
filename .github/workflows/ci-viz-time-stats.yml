name: CI Viz timing report

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 6 * * *"
  pull_request:
    paths:
      - ".github/workflows/ci-viz-time-stats.yml"
      - "tests/test_the_test/test_time_stats_report.py"
      - "utils/scripts/ci_orchestrators/compute-ci-viz-time-stats.py"
      - "utils/scripts/ci_orchestrators/run-time-stats.sql"
      - "utils/scripts/ci_orchestrators/time-stats.json"
      - "utils/scripts/ci_orchestrators/time_stats_report.py"
      - "utils/scripts/libraries_and_scenarios_rules.yml"

permissions: {}

jobs:
  validate:
    name: Validate timing report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest==7.1.3 pytest-json-report==1.5.0 requests==2.31.0

      - name: Run report tests
        run: python -m pytest --confcutdir=tests/test_the_test tests/test_the_test/test_time_stats_report.py -q

  report:
    name: Generate timing report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests==2.31.0

      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: system-tests-ci-viz
          retries: 16

      - name: Generate report
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DD_APPLICATION_KEY: ${{ steps.dd-sts.outputs.app_key }}
        run: python utils/scripts/ci_orchestrators/compute-ci-viz-time-stats.py

      - name: Add report to workflow summary
        if: always()
        run: |
          if [[ -f artifacts/ci-viz-time-stats/comparison.md ]]; then
            cat artifacts/ci-viz-time-stats/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: ./.github/actions/upload_artifact
        with:
          name: ci-viz-time-stats-${{ github.run_id }}
          path: artifacts/ci-viz-time-stats
          retention-days: 30
          if-no-files-found: warn
