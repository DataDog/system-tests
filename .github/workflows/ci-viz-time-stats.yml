name: CI Viz timing report

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 6 * * *"
  pull_request:
    paths:
      - ".github/workflows/ci-viz-time-stats.yml"
      - "utils/scripts/ci_orchestrators/compute-ci-viz-time-stats.py"
      - "utils/scripts/ci_orchestrators/run-time-stats.sql"
      - "utils/scripts/ci_orchestrators/time-stats.json"
      - "utils/scripts/ci_orchestrators/time_stats_report.py"

permissions: {}

jobs:
  report:
    name: Generate timing report
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests==2.31.0

      - name: Generate report
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APPLICATION_KEY: ${{ secrets.DD_APPLICATION_KEY }}
        run: python utils/scripts/ci_orchestrators/compute-ci-viz-time-stats.py

      - name: Add report to workflow summary
        if: always()
        run: |
          if [[ -f artifacts/ci-viz-time-stats/comparison.md ]]; then
            cat artifacts/ci-viz-time-stats/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: ./.github/actions/upload_artifact
        with:
          name: ci-viz-time-stats-${{ github.run_id }}
          path: artifacts/ci-viz-time-stats
          retention-days: 30
          if-no-files-found: warn
