name: "Interact with datadog-ci CLI"
description: "Run all datadog-ci command for one job (allow to have only one API call per job on dd-sts)"
inputs:
  datadog_site:
    description: Which DataDog site shoud be used
    default: datadoghq.com
  ci_environment:
    description: "CI environment running the tests (dev/prod/custom), used for Test Optimization tagging"
    default: ""
  push_to_test_optimization:
    description: "true to enable pushing junit.xml files to test optimization"
    default: "false"
  _is_official_system_tests_job:
    description: "Reserved for official system-tests jobs, will tag job in CiViz with _ci_framework:system-tests"
    default: "false"

runs:
  using: composite
  steps:
    - name: Skip for dependabot
      if: github.event.pull_request.user.login == 'dependabot[bot]'
      shell: bash
      run: echo "Skipping datadog-ci for dependabot PRs"

    - name: Install datadog-ci
      continue-on-error: true
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      shell: bash
      run: npm install -g @datadog/datadog-ci || (sleep 60 && npm install -g @datadog/datadog-ci)

    - name: Checkout owner repo
      if: github.event.pull_request.user.login != 'dependabot[bot]' && inputs.push_to_test_optimization == 'true'
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        path: repo

    - name: Get Datadog credentials
      id: dd-sts
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      continue-on-error: true
      uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
      with:
        policy: system-tests
        retries: 16

    # https://docs.datadoghq.com/tests/setup/junit_xml/?tab=linux
    - name: Push results
      continue-on-error: true
      if: github.event.pull_request.user.login != 'dependabot[bot]' && steps.dd-sts.outcome == 'success' && inputs.push_to_test_optimization == 'true'
      shell: bash
      run: |
        cd repo
        datadog-ci junit upload \
          ../logs*/reportJunit.xml \
          --service system-tests \
          --env ci \
          --verbose \
          --xpath-tag "test.codeowners=/testcase/properties/property[@name='test.codeowners']"
      env:
        DATADOG_SITE: ${{ inputs.datadog_site }}
        DATADOG_API_KEY:  ${{ steps.dd-sts.outputs.api_key }}
        DD_TAGS: ${{ inputs.ci_environment != '' && format('test.configuration.ci_environment:{0}', inputs.ci_environment) || '' }}

    - name: Tag system-tests workflow
      continue-on-error: true
      if: github.event.pull_request.user.login != 'dependabot[bot]' && steps.dd-sts.outcome == 'success' && inputs._is_official_system_tests_job == 'true'
      shell: bash
      run: datadog-ci tag --level job --tags _ci_framework:system-tests
      env:
        DATADOG_SITE: ${{ inputs.datadog_site }}
        DATADOG_API_KEY:  ${{ steps.dd-sts.outputs.api_key }}
