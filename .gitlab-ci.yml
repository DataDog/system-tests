---
# THROWAWAY PROBE BRANCH (nccatoni/nix-kvm-build-probe), NOT FOR MERGE.
#
# The real entry point (the e2e pipeline and the included SSI pipelines) is replaced by a single
# job that times a cold build of the hermetic system-tests package (nix-poc/, copied from
# dd-trace-ops) on the KVM runner pool, every image built in a VM. See nix-poc/ci/probe.sh.
stages:
  - probe

nix-kvm-build-probe:
  stage: probe
  # docker.io/nixos/nix:2.34.7, mirrored by DataDog/images (replication_target: build). Runs as
  # root, which is what /dev/kvm (0660 root:995) and building without nixbld users need.
  image: registry.ddbuild.io/images/mirror/nixos/nix:2.34.7
  tags: ["kvm:amd64"]
  timeout: 2h
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "nccatoni/nix-kvm-build-probe"
  variables:
    GIT_DEPTH: "1"
    OUT: "$CI_PROJECT_DIR/probe-out"
    # The pod is an unprivileged runc container: no Nix sandbox, builds run as root (nixbld
    # users could not open /dev/kvm), and vmTools needs the `kvm` system feature. No binary cache
    # of our own: only cache.nixos.org, so nixpkgs is substituted and everything specific to
    # system-tests (fetches, runner, images, package) is built.
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      sandbox = false
      filter-syscalls = false
      build-users-group =
      system-features = kvm big-parallel nixos-test benchmark
      max-jobs = auto
      substituters = https://cache.nixos.org
      trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      accept-flake-config = false
      warn-dirty = false
  script:
    - bash nix-poc/ci/probe.sh
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - probe-out/
    exclude:
      - probe-out/drvs.json
